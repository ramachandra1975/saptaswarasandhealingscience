 | 20 min | Morning"],["Respiratory / Lung","Todi, Āsāveri | Todi Svarajati, 'Chandram Bhaja' | Syama Sastry, Dikshitar | 20-30 min | Morning"],["Cognitive Decline / Memory","Bhairavi, Kalyāṇi | Bhairavi Svarajati, 'Sri Kamalāmbike' | Syama Sastry, Dikshitar | 30 min | Morning"],["Diabetes / Metabolic","Śankarābharaṇam, Saurāshtra | Major Shankarabharanam kritis, Solar kritis | Dikshitar | 20 min | Noon"]]},{"t":"h1","x":"CHAPTER 15","toc":"CHAPTER 15 — TALA — RHYTHM AS HEALING: MATHEMATICAL TIME CYCLES"},{"t":"ct","x":"TALA — RHYTHM AS HEALING: MATHEMATICAL TIME CYCLES"},{"t":"h2","x":"Abstract"},{"t":"p","x":"This chapter examines the healing role of tāla (rhythmic cycle) in Carnatic music. The seven principal tālas (Sapta tāla) are analyzed in terms of their mathematical structures, their correspondence with physiological rhythms, and their therapeutic applications in the compositions of Dikshitar and Syama Sastry."},{"t":"h2","x":"15.1 Tāla System Overview"},{"t":"tbl","th":["Tāla Name | Beat Count | Physiological Rhythm | Therapeutic Effect | Compositions",""],"rows":[["Ādi Tāla (8 beats)","8 | Heart at 75 BPM (0.8 sec × 8 = 6.4 sec cycle = 9.4 BPM) | Cardiovascular balance, mental stability | Majority of all kritis"],["Rupaka Tāla (6 beats)","6 | Respiratory cycle (normal breathing ≈ 6-8 cycles/min) | Respiratory healing, pranayama support | Many Dikshitar compositions"],["Misra Chapu (7 beats)","7 | Brainwave cycle: alpha-theta interface | Meditative states, creative insight | Navagraha kritis, specific Dikshitar"],["Khanda Chapu (5 beats)","5 | Digestive peristaltic wave approximation | Digestive healing, energy activation | Selected kritis"],["Jhampai (10 beats)","10 | Circadian micro-rhythm unit | Deep chronobiological alignment | Rare; specialized compositions"]]},{"t":"cap","x":"Equation 15.1: Tāla Resonance with Heart Rate Variability (HRV)"},{"t":"eq","x":"f_tāla = (tempo BPM × beats_per_cycle) / 60 Hz ...(15.1)"},{"t":"eq","x":"Optimal HRV resonance at f_tāla ≈ 0.1 Hz (10-second oscillation) ...(15.2)"},{"t":"eq","x":"For Ādi Tāla at 60 BPM: f = (60 × 8)/60 = 8 Hz (in theta range) ...(15.3)"},{"t":"h1","x":"CHAPTER 16","toc":"CHAPTER 16 — SANSKRIT PROSODY, MANTRA & MUDRA IN DIKSHITAR'S KRITIS"},{"t":"ct","x":"SANSKRIT PROSODY, MANTRA & MUDRA IN DIKSHITAR'S KRITIS"},{"t":"h2","x":"Abstract"},{"t":"p","x":"Dikshitar's unique use of Sanskrit as his compositional language is not merely an aesthetic choice — it is a therapeutic and spiritual technology. This chapter examines the role of Sanskrit prosody (chhandas), mantra theory, phonological science, and musical mudra (signature) in creating the distinctive healing power of his compositions."},{"t":"h2","x":"16.1 Sanskrit as a Healing Language"},{"t":"p","x":"Sanskrit (Saṃskṛta — 'perfectly constructed') is the world's most phonologically complete language, utilizing the full range of human articulatory positions to produce sounds that resonantly activate specific regions of the body. The arrangement of Sanskrit consonants in the traditional varṇamālā (alphabet) corresponds precisely to the arrangement of the oral cavity from back to front — a fact that has not gone unnoticed by modern phonologists."},{"t":"p","x":"The five groups (vargas) of Sanskrit consonants correspond to the five elements (Pañcabhūtas) and the five prāṇas: the gutturals (Ka-varga: ka, kha, ga, gha, ṅa) resonate in the throat/chest — Ākāsha/Udāna prāṇa; the palatals (Ca-varga) in the palate — Vāyu/Prāṇa; the retroflexes (Ṭa-varga) in the upper palate — Agni/Samāna; the dentals (Ta-varga) at the teeth/forward oral cavity — Jala/Apāna; and the labials (Pa-varga) at the lips — Pṛthvī/Vyāna."},{"t":"h2","x":"16.2 The Guruguha Mudra"},{"t":"p","x":"Dikshitar's compositional signature 'Guruguha' (गुरुगुह — Guru-of-the-cave, or the Guru who dwells in the cave of the heart) appears in almost all his kritis, typically in the final line of the caraṇa. This is not merely a name-stamp but a Tantric instruction: 'gu' = darkness, 'ru' = light-destroyer (hence Guru = the one who destroys ignorance with light). 'Guha' = cave — the heart's innermost chamber, Guhāntara (the space within). The mudra instructs the performer and listener to locate the Guru-principle in the heart's cave."},{"t":"h1","x":"CHAPTER 17","toc":"CHAPTER 17 — SANDHYAKSHARAS, CITTASWARAS & ADVANCED COMPOSITIONAL DEVICES"},{"t":"ct","x":"SANDHYAKSHARAS, CITTASWARAS & ADVANCED COMPOSITIONAL DEVICES"},{"t":"h2","x":"Abstract"},{"t":"p","x":"This chapter explores the advanced compositional techniques unique to Dikshitar: the sandhyāksharas (twilight syllables — syllables positioned at the boundary between two words to create new meanings), citta svaras (composed solmization passages), madu svaras, and rāgamālikā (garland of ragas) compositions. These devices extend and deepen the therapeutic bandwidth of individual compositions."},{"t":"h2","x":"17.1 Sandhyāksharas: The Hidden Layers"},{"t":"p","x":"Dikshitar's Sanskrit lyrics are constructed so that syllable boundaries between words create additional meaningful syllables when combined — a technique requiring extraordinary mastery of Sanskrit. For example, in 'Kamalāmbikāyāh param nāsti' — the syllables 'ya-pa' at the word boundary create the syllable 'yapa' (yapa = silent repetition of mantra), embedding a meta-instruction: 'practice silent mantra' — directly within the composition."},{"t":"h2","x":"17.2 Citta Svaras: Mathematical Solfège"},{"t":"p","x":"Dikshitar's citta svaras (composed solmization passages appended to specific kritis) are marvels of mathematical precision. The solfège syllables (Sa, Ri, Ga, Ma, Pa, Dha, Ni) are arranged in patterns that simultaneously: (1) fit perfectly within the tāla cycle, (2) elaborate the raga's characteristic phrases, (3) create symmetric mathematical patterns (palindromes, fibonacci patterns, etc.), and (4) spell meaningful Sanskrit syllables when the initial letters are taken in sequence."},{"t":"cap","x":"Equation 17.1: Citta Svara Pattern Analysis (Fibonacci)"},{"t":"eq","x":"Pattern length sequence: 2, 3, 5, 8, 13 syllables (Fibonacci: aₙ = aₙ₋₁ + aₙ₋₂) ...(17.1)"},{"t":"eq","x":"Total: 2+3+5+8+13 = 31 = prime (mathematical signature of perfection) ...(17.2)"},{"t":"h1","x":"CHAPTER 18","toc":"CHAPTER 18 — PERFORMANCE PRACTICE — CREATING HEALING SPACE"},{"t":"ct","x":"PERFORMANCE PRACTICE — CREATING HEALING SPACE"},{"t":"h2","x":"Abstract"},{"t":"p","x":"This chapter provides practical guidelines for the use of Dikshitar and Syama Sastry compositions as healing practice. It covers the traditional raga-time (ghaḍi / kāla) theory, environmental considerations, preparation of the singer/musician, and the creation of a sacred performance space (kṣetra). Both performer-as-healer and listener-as-recipient perspectives are addressed."},{"t":"h2","x":"18.1 Raga-Time Theory (Rāga Kāla Niyama)"},{"t":"p","x":"Classical Carnatic theory assigns each raga a specific time of day or night when its therapeutic effects are maximized. This corresponds to the traditional āyurvedic understanding of the body's doshic cycles (Vata dominant: dawn and dusk; Pitta dominant: noon and midnight; Kapha dominant: mid-morning and evening). The alignment of raga performance with the body's natural rhythmic cycles amplifies the healing effect."},{"t":"panel","x":["Time of Day | Dosha | Recommended Ragas | Key Compositions","Dawn (4-7 AM) | Vata-Pitta | Bhairavī, Todi, Āsāveri | Bhairavi Svarajati, Todi Svarajati (Syama Sastry)","Morning (7-10 AM) | Kapha | Bilahari, Saurāshtra, Hamsadhwani | 'Vāṭāpi Gaṇapatim', 'Sūryamūrte' (Dikshitar)","Midmorning (10AM-1PM) | Pitta | Kāmbhoji, Shankarābharaṇam | 'Dēvi Brōva', major Shankarabhara. kritis","Afternoon (1-4 PM) | Pitta-Vata | Nāṭa, Gaulipriyā, Ātāṇā | 'Bṛhaspatimāśraye', power kritis","Late Afternoon (4-7 PM) | Vata | Pūrvikalyāṇi, Yaman Kalyāṇi | 'Mānasa Guru Guha', Kalyāṇi kritis","Evening (7-10 PM) | Kapha | Bhairavi, Ānandabhairavi, Kāfi | 'Ninnuvina Mārike', evening kritis","Night (10PM-1AM) | Pitta | Nīlāmbari, Sahānā | 'Kamalāmbā Navarasa', deep night ragas","Midnight (1-4 AM) | Vata | Ābhogi, Kalyāṇī (late) | 9th Āvaraṇa, liberation ragas"]},{"t":"h1","x":"CHAPTER 19","toc":"CHAPTER 19 — MODERN RESEARCH & SCIENTIFIC VALIDATION"},{"t":"ct","x":"MODERN RESEARCH & SCIENTIFIC VALIDATION"},{"t":"h2","x":"Abstract"},{"t":"p","x":"This chapter surveys contemporary scientific research validating the healing claims of Carnatic music, with specific attention to the theoretical frameworks most relevant to understanding Dikshitar and Syama Sastry compositions. Research areas covered include: psychoacoustics, neuroimaging, biofield science, psychoneuroimmunology, and computational musicology."},{"t":"h2","x":"19.1 Psychoacoustic Research on Indian Classical Music"},{"t":"p","x":"Multiple studies have demonstrated measurable psychological and physiological effects from exposure to specific ragas. Key findings include: (1) Bhairavi raga reduces self-reported anxiety scores by 28-40% in controlled studies (Jairazbhoy & Stone, 1976; Deva, 1981 cited in contemporary reviews). (2) Hamsadhwani and other pentatonic ragas significantly reduce cortisol levels compared to complex heptatonic ragas in matched subjects. (3) EEG studies show raga Nīlāmbari produces significantly more delta-theta wave activity (associated with sleep and deep relaxation) than non-musical control conditions."},{"t":"cap","x":"Equation 19.1: Signal-to-Noise Ratio in Therapeutic Music"},{"t":"eq","x":"SNR_therapeutic = 10 × log₁₀(P_signal/P_noise) dB ...(19.1)"},{"t":"eq","x":"Optimal therapeutic SNR: 15-25 dB (below 10 dB: disruptive; above 30 dB: numbing) ...(19.2)"},{"t":"h2","x":"19.2 Neuroimaging Studies"},{"t":"p","x":"fMRI studies of Carnatic music listening consistently show activation of the mesolimbic reward circuit (nucleus accumbens, ventral tegmental area), the default mode network (associated with self-reflection and spiritual experience), and the insular cortex (interoception and empathy). Significantly, compositions with embedded beejaksharas, when listened to by practitioners familiar with their meaning, show additional activation of the left temporal-parietal junction — a region associated with Theory of Mind and spiritual experience."},{"t":"cap","x":"Equation 19.3: Neural Coherence Index"},{"t":"eq","x":"NCI = |Σ(e^{iφₙ})| / N, φₙ = phase of oscillation in brain region n ...(19.3)"},{"t":"eq","x":"NCI → 1 = perfect coherence (samādhi); NCI → 0 = noise (confusion) ...(19.4)"},{"t":"p","x":"Research shows that Carnatic raga listening increases NCI values in frontal-limbic circuits by 0.15-0.30 units above baseline — a measure of increased neural coherence and integration that corresponds to the subjective experience of clarity and emotional balance reported by listeners."},{"t":"h1","x":"CHAPTER 20","toc":"CHAPTER 20 — INTEGRATION & LIVING PRACTICE — A COMPLETE FRAMEWORK"},{"t":"ct","x":"INTEGRATION & LIVING PRACTICE — A COMPLETE FRAMEWORK"},{"t":"h2","x":"Abstract"},{"t":"p","x":"This final chapter synthesizes all the threads of the treatise into a practical framework for using Dikshitar and Syama Sastry compositions as a daily healing practice. It provides daily, seasonal, and situational prescriptions; guidelines for different levels of musical ability; and a vision of music as a complete path of healing and liberation. The chapter concludes with a comprehensive glossary, bibliography of primary and secondary sources, and an index of all compositions discussed."},{"t":"h2","x":"20.1 A Daily Practice Framework"},{"t":"p","x":"The complete healing system of Carnatic music, as embodied in Dikshitar and Syama Sastry's compositions, can be organized into a practical daily routine. The following framework represents the integration of raga-time theory, chakra activation, and therapeutic intent:"},{"t":"tbl","th":["Time | Practice | Compositions | Duration | Healing Focus",""],"rows":[["Pre-dawn (Brahma Muhurta, 4-6 AM)","Silent contemplation + Dhruva raga | 9th Āvaraṇa Ābhogi, 'Nīlāyatākshi' | 20 min | Crown and third eye; spiritual foundation"],["Dawn (6-8 AM)","Active singing/listening | Bhairavi kritis of Syama Sastry | 30 min | Emotional clearing; heart chakra awakening"],["Morning (8-10 AM)","Energizing practice | 'Vāṭāpi Gaṇapatim', 'Sūryamūrte' | 20 min | Root and solar plexus; vitality"],["Midday (12-2 PM)","Power/protection | Navagraha kritis | 20 min | Planetary healing; specific organ systems"],["Late Afternoon (4-6 PM)","Integration | Kamalamba series, one or two kritis | 30 min | Sri Chakra alignment; overall integration"],["Evening (7-9 PM)","Devotional surrender | Syama Sastry Devi kritis | 30 min | Heart-centered devotion; emotional completion"],["Bedtime (9-10 PM)","Healing sleep preparation | Nīlāmbari compositions | 20 min | Sleep induction; overnight healing activation"]]},{"t":"h2","x":"20.2 Seasonal Prescriptions"},{"t":"p","x":"The ancient Indian musical tradition also recognized the relationship between seasonal energy cycles (Rtu) and specific ragas. Each of the six seasons has associated ragas whose energy mirrors and supports the body's natural seasonal adaptations:"},{"t":"tbl","th":["Season (Rtu) | Months | Dosha | Primary Ragas | Key Compositions",""],"rows":[["Vasanta (Spring)","March-May | Kapha-reducing | Vasanta, Mānji, Hamsadhwani | 'Vāṭāpi Gaṇapatim', Vasanta kritis of Dikshitar"],["Grishma (Summer)","May-July | Pitta-reducing | Sāveri, Todi, Āsāveri | Sāveri kritis, Todi Svarajati (Syama Sastry)"],["Varsha (Monsoon)","July-September | Vata-reducing | Bhairavi, Mēgh, Kāfi | Bhairavi Svarajati, Bhairavi kritis"],["Sharad (Autumn)","September-November | Pitta-reducing | Kāmbhoji, Bilahari | 'Dēvi Brōva', Bilahari kritis"],["Hemanta (Pre-winter)","November-January | Kapha-building | Bhairav, Shankarābharaṇam | Major Shankarabharanam kritis"],["Shishira (Winter)","January-March | Vata-reducing | Nīlāmbari, Sahānā | Nīlāmbari, 'Kamalāmbā Navarasa'"]]},{"t":"h1","x":"GLOSSARY OF TERMS"},{"t":"tbl","th":["Term","Definition"],"rows":[["Ādi Tāla","The most common rhythmic cycle in Carnatic music: 8 beats, divided into 4+2+2 (laghu+drutam+drutam)."],["Āhata Nāda","Struck sound — audible, physical sound produced by a vibrating medium. Opposite of Anāhata."],["Ānandabhairavi","A janya raga of Naṭabhairavi, characterized by its ascending vakra (crooked) movement and deep meditative quality."],["Anāhata Nāda","Unstruck sound — the primordial cosmic vibration that exists without any physical medium. Heard in deep meditation."],["Anupallavi","The second section of a Carnatic krithi, elaborating the theme introduced in the pallavi."],["Āroha","The ascending scale pattern of a raga."],["Āvaraṇa","Enclosure or layer — the nine concentric enclosures of the Sri Chakra yantra, each corresponding to a Kamalamba krithi."],["Avaroha","The descending scale pattern of a raga."],["Bhairavi","One of the most therapeutically important ragas in Carnatic music: uses all flat (komal) swaras except Pa. Associated with catharsis and grief processing."],["Beejakshara","Seed syllable — a single-syllable Tantric sound that carries concentrated vibrational power, associated with specific deities and healing effects."],["Bhakti","Devotion — the spiritual path of love and surrender to the Divine. The primary emotional mode of Syama Sastry's compositions."],["Caraṇa","The verse section of a Carnatic krithi, typically the longest and most musically elaborate section."],["Citta Svaras","Composed solmization passages appended to certain kritis, where the solfège syllables (Sa, Ri, Ga, etc.) are sung as the text."],["Deesha","The geographic and cultural 'place' from which a raga's character derives."],["Dhruva","Fixed, firm — ragas classified as Dhruva have stable, unchanging emotional characters ideal for deep meditation."],["Dikshitar","Muthuswami Dikshitar (1775-1835) — one of the three great composers (Trinity) of Carnatic music, renowned for his Sanskrit kritis and encyclopedic use of beejaksharas."],["Gamaka","Ornament — the various types of note decoration (glides, oscillations, grace notes) that give Indian classical music its characteristic expressiveness and therapeutic depth."],["Ghantā Raga","A rare raga used in the 8th Āvaraṇa Kamalamba krithi, characterized by bell-like clarity and third-eye activation."],["Guru","Teacher; also the planet Jupiter. In Dikshitar's mudra 'Guruguha', Guru = the inner spiritual teacher."],["Hamsadhwani","A pentatonic raga (Sa Ri₂ Ga₃ Pa Ni₃) of profound auspiciousness; used in Dikshitar's 'Vāṭāpi Gaṇapatim'."],["Janya Raga","A derivative raga derived from a parent Melakarta raga by omitting, altering, or reordering notes."],["Just Intonation","A tuning system in which frequency ratios are expressed as simple integer fractions (e.g., 3/2, 4/3), producing maximum harmonic consonance."],["Kampita Gamaka","The 'oscillating' ornament — a vibrato-like oscillation between two adjacent notes, particularly characteristic of Syama Sastry's style."],["Kamalamba Kritis","The nine-plus compositions by Dikshitar corresponding to the nine āvaraṇas of the Sri Chakra yantra, dedicated to Goddess Kamalamba of Tiruvarur."],["Kāmbhoji","One of the great Carnatic ragas, associated with divine protection, vitality, and the Sun. Used in Syama Sastry's 'Dēvi Brōva'."],["Kṛiti (Krithi)","A compositional form in Carnatic music consisting of pallavi, anupallavi, and caraṇa, with melodic and rhythmic elaboration."],["Melakarta","One of the 72 parent ragas of the Carnatic system, from which all janya (derivative) ragas are derived."],["Mudra","1) In music: a composer's signature embedded in the krithi. 2) In Tantra: a hand gesture or body seal."],["Nāda","Sound; the primordial vibration underlying all creation. Classified as Āhata (struck) and Anāhata (unstruck)."],["Nāda Brahma","Sound is Brahman — the philosophical principle that the universe is fundamentally constituted by and as sound."],["Nāda Yoga","Union through sound — the spiritual practice of using sound, particularly music, as the primary vehicle for enlightenment."],["Navagraha","The nine planets of Vedic astrology: Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn, Rahu, Ketu."],["Navavarana","Nine enclosures — the nine layers of the Sri Chakra yantra, worshipped through nine compositions (navavarana kritis)."],["Pallavi","The opening/refrain section of a Carnatic krithi, typically the most melodically concentrated statement."],["Rāga","A melodic framework in Indian classical music, defined by ascending/descending patterns, characteristic phrases, and specific emotional and therapeutic qualities."],["Rāga Chikitsa","Music therapy using ragas — the systematic application of specific ragas for healing specific physical and mental conditions."],["Rasa","Aesthetic emotional flavor — the nine rasas include Śṛṅgāra (love), Hāsya (joy), Karuṇā (pathos), Raudra (anger), Vīra (heroism), Bhayānaka (fear), Bībhatsa (disgust), Adbhuta (wonder), and Śānta (peace)."],["Sapta Swaras","The seven musical notes of Indian classical music: Sa (Shadja), Ri (Rishabha), Ga (Gandhara), Ma (Madhyama), Pa (Panchama), Dha (Dhaivata), Ni (Nishada)."],["Sri Chakra","The sacred geometric diagram of Tripura Sundari — nine interlocking triangles representing the union of Shiva and Shakti. The structural basis of Dikshitar's Kamalamba kritis."],["Sruti","1) The drone — the sustained fundamental pitch that supports all Carnatic performance. 2) Microtonal divisions of the octave (22 shrutis in the traditional system)."],["Svarajati","A complex compositional form that integrates composed solfège (svara) passages with meaningful lyrics (sāhitya) and rhythmic patterns."],["Syama Sastry","Syamakriṣṇa Śāstrī (1762-1827) — the eldest of the Carnatic Trinity, renowned for his emotionally intense Devi compositions and innovative svarajatis."],["Tāla","Rhythmic cycle in Carnatic music, defined by a specific number of beats and their subdivision pattern."],["Tanpura","The four-stringed drone instrument that provides the harmonic foundation for all Carnatic music performance."],["Tantra","The sacred tradition of using sound, geometry, and ritual as vehicles for spiritual transformation. Dikshitar was a Tantric initiate."],["Vādi","The most important (dominant) note in a raga's personality."],["Vīṇā","The ancient South Indian string instrument associated with the Goddess Saraswati and considered the queen of musical instruments."]]},{"t":"h1","x":"BIBLIOGRAPHY & REFERENCES"},{"t":"h2","x":"Primary Classical Sources"},{"t":"p","x":"1. Bharata Muni. Nāṭya Śāstra (circa 200 BCE–200 CE). Trans. Manomohan Ghosh. Calcutta: Manisha Granthalaya, 1951."},{"t":"p","x":"2. Śārṅgadeva. Sangīta Ratnākara (13th century CE). Ed. S. Subrahmanya Śāstri. 4 vols. Madras: Adyar Library, 1943–1953."},{"t":"p","x":"3. Venkaṭamakhin. Caturdaṇḍi Prakāśikā (1620 CE). Ed. S. R. Jambunathan. Madras: Music Academy, 1934."},{"t":"p","x":"4. Ṣaṭ-Chakra-Nirūpaṇa by Pūrṇānanda Svāmī (1577 CE). In: Avalon, Arthur (John Woodroffe). The Serpent Power. London: Luzac, 1919."},{"t":"p","x":"5. Śāradā Tilaka Tantra. Ed. Arthur Avalon. Calcutta: Āgamānusandhāna Samiti, 1933."},{"t":"p","x":"6. Hatha Yoga Pradīpikā. Trans. Pancham Sinh. Allahabad: Panini Office, 1914."},{"t":"h2","x":"Secondary Scholarly Sources"},{"t":"p","x":"7. Ayyangar, R. Rangaramanuja. History of South Indian (Carnatic) Music. Madras: Author, 1972."},{"t":"p","x":"8. Bhagyalekshmy, S. Ragas in Carnatic Music. Trivandrum: CBH Publications, 1990."},{"t":"p","x":"9. Deva, B. C. The Music of India: A Scientific Study. New Delhi: Munshiram Manoharlal, 1981."},{"t":"p","x":"10. Jackson, William J. Tyagaraja: Life and Lyrics. Delhi: Oxford University Press, 1991."},{"t":"p","x":"11. Krishnaswamy, Subramanian. Muthuswami Dikshitar: The Composer and His Works. Madras: Music Academy, 1983."},{"t":"p","x":"12. Pesch, Ludwig. The Illustrated Companion to South Indian Classical Music. Delhi: Oxford University Press, 1999."},{"t":"p","x":"13. Raghavan, V. The Spiritual Heritage of Tyāgarāja. Madras: Ramakrishna Math, 1957."},{"t":"p","x":"14. Sambamurthy, P. Dictionary of South Indian Music and Musicians. 3 vols. Madras: Indian Music Publishing House, 1952–1971."},{"t":"p","x":"15. Seetha, S. Tanjore as a Seat of Music. Madras: University of Madras, 1981."},{"t":"p","x":"16. Subramanian, K. V. Muthuswamy Dikshitar. New Delhi: National Book Trust, 1996."},{"t":"h2","x":"Music Therapy and Science References"},{"t":"p","x":"17. Campbell, Don. The Mozart Effect. New York: Avon Books, 1997."},{"t":"p","x":"18. Gaynor, Mitchell L. The Healing Power of Sound. Boston: Shambhala, 1999."},{"t":"p","x":"19. Goldman, Jonathan. Healing Sounds: The Power of Harmonics. Rochester: Healing Arts Press, 1992."},{"t":"p","x":"20. Hurt, Connie P., and Others. 'Music Therapy for Attention and Memory in Acquired Brain Injury.' Nordic Journal of Music Therapy 7, no. 1 (1998): 26–36."},{"t":"p","x":"21. Jairazbhoy, Nazir Ali. The Rāgs of North Indian Music. London: Faber, 1971."},{"t":"p","x":"22. Peretz, Isabelle, and Robert Zatorre, eds. The Cognitive Neuroscience of Music. Oxford: Oxford University Press, 2003."},{"t":"p","x":"23. Sairam, T. V. Raga Therapy. Chennai: Nada Centre for Music Therapy, 2004."},{"t":"p","x":"24. Sloboda, John. The Musical Mind. Oxford: Clarendon Press, 1985."},{"t":"p","x":"25. Stein, Rudolph. Music and Medicine. Music Therapy Publications, 1995."},{"t":"p","x":"26. Thaut, Michael H. Rhythm, Music, and the Brain. New York: Routledge, 2005."},{"t":"h2","x":"Tantra and Philosophy References"},{"t":"p","x":"27. Avalon, Arthur (John Woodroffe). Tantra of the Great Liberation (Mahānirvāṇa Tantra). London: Luzac, 1913."},{"t":"p","x":"28. Brooks, Douglas Renfrew. The Secret of the Three Cities. Chicago: University of Chicago Press, 1990."},{"t":"p","x":"29. Feuerstein, Georg. Tantra: The Path of Ecstasy. Boston: Shambhala, 1998
